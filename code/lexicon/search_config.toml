# ============================================================
# GLEAN SEARCH CONFIG -- one file, three sections
# ============================================================
# THIS IS THE FILE YOU EDIT to configure the search server and
# the search CLI. Open it. Read the section headers. Change
# values. Save. Restart the server (or client). Done.
#
# Three sections:
#
#   [retrieval]      = what the search engine returns and how
#                      it ranks  (read by the server)
#   [server_rerank]  = second-pass scoring run server-side
#                      (cross-encoder + optional LLM tiebreak)
#   [client_rerank]  = second-pass scoring run client-side
#                      (same shape as server_rerank, but the
#                      CLI reads it instead of the server)
#
# Per-request overrides: clients can send a `policy_overrides`
# field in the JSON payload to override [retrieval] fields for
# a single call. That's the right place for per-call tweaks.
# This TOML is for defaults.
#
# Lookup order: this directory first, then ~/.glean/.
# ============================================================


# ============================================================
# [retrieval] -- what the search engine returns and how it ranks
# ============================================================
# Out-of-the-box defaults: snap to standard contemporary
# language, exclude slurs and offensive terms, soft-demote
# dated vocabulary, preserve specialist terms (leukemia stays
# leukemia, not cancer).
#
# CONTENT-IDENTICAL vs RELATED-BUT-DISTINCT:
#
# snap_to_standard rewrites slang/dated/marked terms to their
# standard form, but ONLY within content-identical groups.
#
#   "kiddo" -> "children"     (same content, different register)
#   "daddy-o" -> "father"     (same content, different register)
#   "pops" -> "father"        (same content, different register)
#
# Specialist terms are NOT snapped to their general-audience
# hypernyms:
#
#   "leukemia" stays "leukemia"      (not snapped to "cancer")
#   "negligence" stays "negligence"  (not snapped to "carelessness")
# ============================================================

[retrieval]
default_policy = "snap_to_standard"

# -------- embedder cascade ---------------------------------
# Ranked preference list of embedders to try, by language.
# At boot, the server intersects each list with the embedders
# actually present in the lexicon AND filters out any embedder
# whose coverage (n_rows_with_embedding / n_total_senses) is
# below `embedder_min_coverage`. This prevents the cascade from
# silently picking a half-built embedder whose results would be
# missing most of the lexicon.
#
# Quality order is preserved by the configured list -- if both
# bge-large and bge-small reach the coverage threshold,
# bge-large wins because it appears first.
#
# If a client passes --embedder X explicitly, the cascade and
# coverage gate are BYPASSED. Lexicon authors testing a partial
# embedder use this.
# -----------------------------------------------------------
embedder_min_coverage = 0.95

[retrieval.embedder_cascade]
# Default cascade leads with bge-large-en-v1 (English-only, strong
# semantic separation, ~335M params, 1024-dim). bge-m3 is intentionally
# omitted from the default because it is multilingual-generalist and
# tends to underperform bge-large on English-only retrieval; turn it
# back on in the `multilingual` row when you need cross-lingual matching.
default = ["bge-large-en-v1", "bge-medium-en-v1", "bge-small-en-v1"]
en = ["bge-large-en-v1", "bge-medium-en-v1", "bge-small-en-v1"]
multilingual = ["bge-m3-v1", "bge-large-en-v1", "bge-small-en-v1"]


# -------- snap_to_standard (the recommended default) --------
[retrieval.policies.snap_to_standard]
# Rewrite results to their content_identical_group's standard
# form when one exists at the requested audience_tier.
rewrite_to_standard_form = true

# Never rewrite specialist (medicine/law/science/...) or
# technical (subspecialty) terms even if a group exists.
# The leukemia rule.
preserve_specialist_terms = true

# Audience tier for content_identical lookups. "general"
# matches most users. "expert_medical", "expert_legal", etc.
# opt into specialty content-identical groups.
audience_tier = "general"

# Hard exclusions: results matching ANY of these are dropped
exclude_social_status = ["slur", "offensive"]
exclude_temporal_status = ["obsolete"]

# Don't return senses whose lexicon maturity is below this
# tier. Tiers in order: raw, provisional, embedded_v1,
# improved, embedded_v2, clustered, related.
min_tier_returned = "improved"

# Soft demotions: results matching these get a cosine penalty
# applied to their score before re-ranking. 0.0 = no penalty,
# 0.10 = treat as 0.10 less similar than the raw cosine says.
[retrieval.policies.snap_to_standard.demote_register]
slang = 0.08
vulgar = 0.15
poetic = 0.03

[retrieval.policies.snap_to_standard.demote_temporal]
dated = 0.05
archaic = 0.10

[retrieval.policies.snap_to_standard.demote_social]
flagged = 0.10


# -------- snap_to_neutral (substitution-based) -------------
# For general-audience deployments. Slurs and offensive terms are
# not dropped (which leaves the user with no answer) but SUBSTITUTED
# with their content-identical neutral form. A query that hits a
# slur sense returns its content-identical neutral equivalent
# (the group's standard_form_wsid). If a marked sense has no group
# or its group has no neutral standard form, on_snap_failure
# decides what to do: "drop" (omit), "passthrough" (return
# unchanged), or "sentinel" (return a placeholder result tagged
# excluded_by_policy).
#
# This policy is the most graceful failure mode for a public
# search interface: it understands what the user meant and returns
# the dignified version. It depends on the content_identical_group
# table being populated by the clustering pipeline; until then the
# substitutions cannot occur and behavior falls back to whatever
# on_snap_failure specifies.
[retrieval.policies.snap_to_neutral]
rewrite_to_standard_form = true
preserve_specialist_terms = true
audience_tier = "general"

# Substitute marked senses with their content-identical neutral
# form. Lists the social/temporal statuses that trigger a snap.
snap_social_status = ["slur", "offensive", "vulgar"]
snap_temporal_status = ["obsolete"]

# What to do when a marked sense has no neutral substitute available:
#   "drop"        = omit it (most conservative)
#   "passthrough" = return it unchanged (preserves recall, breaks promise)
#   "sentinel"    = return a placeholder result tagged excluded_by_policy
on_snap_failure = "drop"

# These hard exclusions still apply ON TOP OF substitution, in case
# the snap target itself is marked (defensive).
exclude_social_status = []
exclude_temporal_status = []

min_tier_returned = "improved"

[retrieval.policies.snap_to_neutral.demote_register]
slang = 0.08
vulgar = 0.15
poetic = 0.03

[retrieval.policies.snap_to_neutral.demote_temporal]
dated = 0.05
archaic = 0.10

[retrieval.policies.snap_to_neutral.demote_social]
flagged = 0.10


# -------- preserve_register (distinct narrator voices) -----
[retrieval.policies.preserve_register]
# Match the source's metadata profile. GLEAN uses this when
# compiling a slang-heavy first-person narrator -- "kiddo"
# stays "kiddo", not "children".
rewrite_to_standard_form = false
preserve_specialist_terms = true
audience_tier = "general"
exclude_social_status = ["slur"]
exclude_temporal_status = []
min_tier_returned = "improved"

[retrieval.policies.preserve_register.demote_register]
[retrieval.policies.preserve_register.demote_temporal]
[retrieval.policies.preserve_register.demote_social]


# -------- research_unfiltered (for lexicon authoring) ------
# All senses, including raw and offensive. Lexicon editors
# use this to inspect the full record.
[retrieval.policies.research_unfiltered]
rewrite_to_standard_form = false
preserve_specialist_terms = true
audience_tier = "general"
exclude_social_status = []
exclude_temporal_status = []
min_tier_returned = "raw"

[retrieval.policies.research_unfiltered.demote_register]
[retrieval.policies.research_unfiltered.demote_temporal]
[retrieval.policies.research_unfiltered.demote_social]


# ============================================================
# [search_pipeline] -- server-side cascade
# ============================================================
# Four-stage cascade. Each stage has a uniform `mode` knob:
#
#   "always"      = run this stage on every query
#   "never"       = skip this stage entirely
#   "when_tight"  = run only when the prior stage left the
#                   top-1/top-2 score margin below threshold
#
# Stage 1: cosine retrieval (bi-encoder; always on; entry point)
# Stage 2: cross-encoder reranker
# Stage 3: BM25 lexical scoring over candidates retained so far
# Stage 4: LLM tiebreak (slowest; opt-in)
#
# Each downstream stage operates only on the candidates retained
# by the prior stage, so BM25 and the LLM never see the full
# lexicon -- they only see whatever the cheaper stages narrowed
# the query down to. This keeps the cheap path cheap when it is
# confident and reserves the expensive stages for the genuinely
# hard cases.
# ============================================================

[search_pipeline]
# Cosine retrieval (Stage 1) is always on. These knobs tune it.
cosine_top_n = 50
# For high-polyseme lemmas (lemmas with many distinct senses,
# such as "bank" or "run"), widen the cosine recall set so the
# downstream stages have enough candidates to disambiguate.
cosine_top_n_high_polyseme = 100
high_polyseme_threshold = 20

# -------- Stage 2: cross-encoder reranker --------
[search_pipeline.reranker]
mode = "when_tight"           # always | never | when_tight
margin_threshold = 0.05       # used when mode = when_tight
top_n_out = 10                # narrow to this many candidates
# Cross-encoder models, in preferred order. The first that
# loads successfully wins. Sizes: v2-m3 (~2.3 GB, best,
# multilingual), large (~1.1 GB, strong English), base
# (~280 MB, lightweight). Rerankers are stateless; no
# coverage gate.
models = ["bge-reranker-v2-m3", "bge-reranker-large", "bge-reranker-base"]

# -------- Stage 3: BM25 lexical scoring --------
# Runs on whatever candidates Stage 2 retained (or Stage 1 if
# Stage 2 was skipped). Fetches the text columns for those
# candidates and scores them by classic BM25. This is the
# stage that catches the cases where the embedder is uncertain
# but the exact words give it away.
[search_pipeline.bm25]
mode = "when_tight"           # always | never | when_tight
margin_threshold = 0.04
# Absolute-confidence floor: also fire this stage when the prior
# stage's top-1 score is below this floor, even if the top-1/top-2
# margin looks wide. This catches the "cosine-flat" case where every
# candidate scores low and the embedder is essentially guessing.
# 0.0 disables the floor; sensible values are 0.20 - 0.35 for cosine.
abs_confidence_floor = 0.0
top_n_out = 3
# Fusion: how to combine the prior-stage score with BM25.
#   "weighted"   = alpha * prior_norm + (1 - alpha) * bm25_norm
#   "sequential" = prior stage shortlists, BM25 picks top-N
fusion = "weighted"
weighted_alpha = 0.7          # used when fusion = weighted
# Tokenization. Porter stemmer collapses morphological variants
# ("fished"/"fishing"/"fish" -> one stem).
stemmer = "porter"            # porter | none
lowercase = true

# -------- Stage 4: LLM tiebreak (slowest; opt-in) --------
# Default mode is "when_tight": fire only when the top
# candidates are close in score. LLM calls are slow and
# expensive, so this stage is the last resort.
#
# An alternative mode is "when_tight_divergent": fire only
# when the candidates are close in score AND differ on at
# least one of the listed metadata axes. That mode further
# restricts firing to cases where the LLM's pragmatic
# judgment can change the answer. Use it if you find the
# LLM is firing too often on pragmatically-equivalent
# candidates.
[search_pipeline.llm_tiebreak]
mode = "when_tight"           # always | never | when_tight | when_tight_divergent
margin_threshold = 0.03
# Absolute-confidence floor (see [search_pipeline.bm25] for details).
# When set above 0.0, fires the LLM tiebreak whenever the prior
# stage's top-1 score is below this floor, in addition to the
# margin-based trigger.
abs_confidence_floor = 0.0
divergent_axes = ["register", "social_status", "temporal_status", "specificity"]
top_n_to_llm = 5
llm_wrapper = "llm_wrapper.py"
tier = "flash"
temp = 0.0


# ============================================================
# [client_pipeline] -- client-side cascade (mirror of above)
# ============================================================
# Same shape as [search_pipeline]. The CLI reads this section.
# When BOTH the server and client have stages enabled, the
# server runs first; the client sees the server's already-
# narrowed result and its own cascade usually no-ops (margins
# are already wide after server processing). This is fine and
# idempotent.
#
# Default: client-side cascade is OFF. Turn it on if you want
# belt-and-suspenders rescoring or if you are running against
# a thin server.
# ============================================================

[client_pipeline]
cosine_top_n = 50
cosine_top_n_high_polyseme = 100
high_polyseme_threshold = 20

[client_pipeline.reranker]
mode = "never"
margin_threshold = 0.05
top_n_out = 10
models = ["bge-reranker-v2-m3", "bge-reranker-large", "bge-reranker-base"]

[client_pipeline.bm25]
mode = "never"
margin_threshold = 0.04
abs_confidence_floor = 0.0
top_n_out = 3
fusion = "weighted"
weighted_alpha = 0.7
stemmer = "porter"
lowercase = true

[client_pipeline.llm_tiebreak]
mode = "never"
margin_threshold = 0.03
abs_confidence_floor = 0.0
divergent_axes = ["register", "social_status", "temporal_status", "specificity"]
top_n_to_llm = 5
llm_wrapper = "llm_wrapper.py"
tier = "flash"
temp = 0.0
