# ============================================================
# bootstrap_top_5k.toml
# ============================================================
# A first-bootstrap frontier for the SGF lexicon.
#
# What this produces:
#   - Top 5,000 most-frequent lemmas fully baked: improved
#     microglosses, content-identical groups, standard forms,
#     semantic relations
#   - Polysemous lemmas below rank 25,000 also baked
#   - Proper nouns below rank 10,000 also baked
#   - Sparse-data senses below rank 10,000 also baked
#
# Cost expectations (very rough):
#   - LLM calls: ~6,000 to ~9,000 senses pass through the improver
#     and Stage 11 (each costs one LLM call)
#   - Embedding compute: bge-small for ALL senses (~1.7M);
#     bge-large for ~6K-9K senses
#   - Wall time: 4-12 hours for the LLM passes depending on
#     concurrency; embeddings depend on hardware
#
# Re-run safety:
#   - Re-running this config skips senses already at the target
#     tier. Editing the config to expand scope (e.g., top_lemmas
#     = 20000) processes only the new 15K.
#
# Edit any value below. Save and run:
#   python run_frontier.py --config bootstrap_top_5k.toml --llm-wrapper /path/to/llm.py
# ============================================================

name = "bootstrap_top_5k"
target_tier = "related"   # how far in-scope senses go

# ----- scope: which senses are in scope -----
[scope]
top_lemmas = 5000
include_polysemous_below_rank = 25000
include_proper_nouns_below_rank = 10000
include_sparse_below_rank = 10000

# ----- embeddings -----
# bge-small is the cheap diagnostic embedder, used in Stage 5 and 5.5.
# bge-large is the production embedder used in Stage 8 and onward.
# To add bge-m3 later, run compute_embeddings.py manually with the
# extra method and restart the search server.
[embeddings]
diagnostic = "bge-small-en-v1"
production = "bge-large-en-v1"

# ----- quality gates -----
# The production-pass relaxed self-retrieval rate must reach this
# threshold before the frontier run is considered ship-quality.
# 0.99 is the v1 target.
[quality_gate]
relaxed_pass_rate_min = 0.99

# ----- optional: stage filtering -----
# Uncomment to run only a subset of stages. Useful for iterating
# on one stage's output without rerunning the rest. By default the
# orchestrator runs every stage needed to reach target_tier.
# [stages]
# include = ["3","5","5.5","6","8","8.5","9","10","11"]
